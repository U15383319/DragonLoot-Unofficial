mod_description=An unofficial NeoForge port of DragonLoot for Minecraft 1.21.1. Collect dragon scales from the Ender Dragon and use an End City smithing template to upgrade armor, tools, and weapons. Includes the dragon shield, dragon anvil, and a chestplate with elytra flight.
