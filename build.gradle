plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'dragonloot-onyx'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/neoforge/client')
        }
        server {
            server()
            gameDirectory = project.file('run/neoforge/server')
            programArgument '--nogui'
        }
    }

    mods {
        dragonloot {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel.cloth'
        }
    }
}

dependencies {
    def clothConfig = "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}"
    compileOnly clothConfig
    if (!providers.gradleProperty('withoutClothConfig').isPresent()) {
        runtimeOnly clothConfig
    }
}

tasks.named('processResources', ProcessResources).configure {
    def metadata = [
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_credits: mod_credits, mod_description: mod_description,
            mod_homepage: mod_homepage, mod_issues: mod_issues,
    ]
    inputs.properties metadata
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand metadata
    }
}

def releaseVersion = "${mod_version}-${minecraft_version}-neoforge"

tasks.named('jar', Jar).configure {
    archiveVersion.set(releaseVersion)
    from(['LICENSE', 'NOTICE.md']) {
        into 'META-INF'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

}

tasks.register('releaseSources', Zip) {
    archiveBaseName.set(project.base.archivesName)
    archiveVersion.set(releaseVersion)
    archiveClassifier.set('sources')
    from(layout.projectDirectory) {
        include 'src/**', 'gradle/wrapper/**', 'licenses/**'
        include 'build.gradle', 'gradle.properties', 'settings.gradle', 'gradlew', 'gradlew.bat'
        include 'README.md', 'CHANGELOG.md', 'CREDITS.txt', 'LICENSE', 'NOTICE.md'
    }
}

tasks.named('assemble').configure {
    dependsOn tasks.named('releaseSources')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('mcmodsrepo')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
